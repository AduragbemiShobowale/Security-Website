
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Operative Registration | Flaming Security</title>

    <meta name="description" content="Register as a Flaming Security operative and join your unit.">
    <link rel="icon" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .registration-section {
            max-width: 750px;
            margin: 50px auto;
            padding: 25px;
        }

        .registration-form {
            display: grid;
            gap: 18px;
        }

        .registration-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .registration-form input,
        .registration-form select,
        .registration-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
            box-sizing: border-box;
        }

        .registration-form button {
            padding: 14px;
            cursor: pointer;
        }

        .registration-form .declaration {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .registration-form .declaration input {
            width: 20px;
            height: 20px;
            flex: 0 0 auto;
            margin-top: 2px;
        }

        .registration-form .declaration label {
            margin: 0;
            font-weight: 400;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .registration-section {
                margin: 24px auto;
                padding: 0 16px;
            }
        }

        #registration-message {
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="Flaming Security logo">
      <span class="brand-text">Flaming Security<span>Serving with Excellence</span></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="leadership.html">Leadership</a></li>
      <li><a href="units.html">Units &amp; KPIs</a></li>
      <li><a href="operative-registration.html">Operative Registration</a></li>
      <li><a href="services.html" class="book-badge">Book Us</a></li>
      <li><a href="contact.html" class="cta">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
<section class="registration-section">
    <div class="card">
        <div class="eyebrow">Flaming Security</div>

        <h1>Operative Registration</h1>

        <p>Complete the form below to register under your preferred unit.</p>

        <form id="registration-form" class="registration-form">

            <div>
                <label for="full_name">Full Name</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    required
                    minlength="3"
                    autocomplete="name">
            </div>

            <div>
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email">
            </div>

            <div>
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    minlength="7"
                    autocomplete="tel">
            </div>

            <div>
                <label for="date_of_birth">Date of Birth</label>
                <input
                    type="date"
                    id="date_of_birth"
                    name="date_of_birth"
                    required>
            </div>

            <div>
                <label for="residential_address">Residential Address</label>
                <textarea
                    id="residential_address"
                    name="residential_address"
                    rows="3"
                    required
                    autocomplete="street-address"></textarea>
            </div>

            <div>
                <label for="sub_unit">Select Your Unit</label>
                <select id="sub_unit" name="sub_unit" required>
                    <option value="">Choose a unit</option>
                    <option value="Central Intelligence">Central Intelligence</option>
                    <option value="Advance Team">Advance Team</option>
                    <option value="Access Control">Access Control</option>
                    <option value="Ground Control">Ground Control</option>
                    <option value="Market Control">Market Control</option>
                    <option value="Traffic">Traffic</option>
                    <option value="Management & Welfare">Management & Welfare</option>
                    <option value="All Personnel">All Personnel</option>
                </select>
            </div>

            <div class="declaration">
                <input type="checkbox" id="declaration" name="declaration" required>
                <label for="declaration">I confirm that the information above is accurate and I agree to serve with Flaming Security under its code of conduct.</label>
            </div>

            <button type="submit" class="btn btn-primary" id="submit-button">
                Submit Registration
            </button>

            <p id="registration-message" role="status" aria-live="polite"></p>

        </form>
    </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/registration.js"></script>
<script src="js/main.js"></script>

</body>
</html>
